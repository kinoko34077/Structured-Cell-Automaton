name: Project Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run AppTest regression and capture output
        shell: bash
        run: |
          set +e
          python -m unittest discover -s project/tests -v > project-test-output.txt 2>&1
          status=$?
          cat project-test-output.txt
          echo "$status" > project-test-status.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: sca-apptest-diagnostic
          path: |
            project-test-output.txt
            project-test-status.txt
